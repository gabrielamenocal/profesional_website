<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Gabriela Menocal monogram">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#e8d3c4" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#75401f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <circle cx="180" cy="180" r="142" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="180" cy="180" r="116" fill="none" stroke="#9a5b38" stroke-width="3" stroke-opacity="0.48"/>
  <text x="180" y="201" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="url(#text)" letter-spacing="-9">GM</text>
  <text x="180" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#42526a" letter-spacing="4">ARCHITECTURE</text>
</svg>
